<!DOCTYPE html>
<html>

<head>
    <title>Assignment #3: Next Gen Rendering</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1.5, 20);
        pointLight.position.set(2, 3, 2);
        pointLight.castShadow = true;
        scene.add(pointLight);

        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg');
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            doubleSided: true
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        const pbrParams = {
            baseColor: '#B59410',
            metalness: 0.5,
            roughness: 0.5
        };

        const material = new THREE.MeshStandardMaterial({
            color: pbrParams.baseColor,
            metalness: pbrParams.metalness,
            roughness: pbrParams.roughness
        });
       
        const loader = new THREE.GLTFLoader();
        loader.load('https://Thanaphat-Gee.github.io/winged_helmet.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.material = material; 
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
             model.position.set(0, 1, 0);
            scene.add(model);
        });

    
        const gui = new dat.GUI();
        const matFolder = gui.addFolder('PBR Material');
        matFolder.addColor(pbrParams, 'baseColor').name('Base Color').onChange(value => {
            material.color.set(value);
        });
        matFolder.add(pbrParams, 'metalness', 0, 1, 0.01).name('Metallic').onChange(value => {
            material.metalness = value;
        });
        matFolder.add(pbrParams, 'roughness', 0, 1, 0.01).name('Roughness').onChange(value => {
            material.roughness = value;
        });
        matFolder.open();

        
        const lightFolder = gui.addFolder('Light Position');
        lightFolder.add(pointLight.position, 'x', -10, 10, 0.1);
        lightFolder.add(pointLight.position, 'y', 0, 10, 0.1);
        lightFolder.add(pointLight.position, 'z', -10, 10, 0.1);
        lightFolder.open();

       
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -pointLight.position.y);
        let isDraggingLight = false;

        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

        renderer.domElement.addEventListener('mousedown', (event) => {
            if (event.button === 2) { 
                isDraggingLight = true;
            }
        });
        window.addEventListener('mouseup', () => { isDraggingLight = false; });

        window.addEventListener('mousemove', (event) => {
            if (!isDraggingLight) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const point = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(dragPlane, point)) {
                pointLight.position.x = point.x;
                pointLight.position.z = point.z;
            }
        });

        function animate(t) {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

    </script>
</body>

</html>
