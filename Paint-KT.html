<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paint</title>
<style>
  :root{
    --ribbon-bg: #636b6c;
    --app-bg: #4d4d4d;
    --border: #070000;
    --accent: #000103;
    --accent-soft: #e6f1fb;
    --text: #000000;
    --text-dim: #000000;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--app-bg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    user-select: none;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  
  .titlebar{
    display:flex; align-items:center; gap:8px;
    padding:8px 14px;
    background:var(--ribbon-bg);
    border-bottom:1px solid var(--border);
    font-size:24px; font-weight:900;
  }


  
  .ribbon{
    display:flex; align-items:stretch; gap:18px;
    background:var(--ribbon-bg);
    border-bottom:1px solid var(--border);
    padding:10px 14px 8px;
    overflow-x:auto;
  }
  .group{
    display:flex; flex-direction:column; align-items:center;
    gap:6px;
    padding:0 14px;
    border-right:1px solid var(--border);
    min-width:max-content;
  }
  .group:last-child{ border-right:none; }
  .group-label{
    font-size:11px; color:var(--text-dim); margin-top:auto;
    letter-spacing:.2px;
  }
  .group-body{ display:flex; align-items:center; gap:6px; }

  .tool-btn{
    display:flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    border-radius:6px; border:1px solid transparent;
    background:transparent; cursor:pointer;
    color:var(--text);
    font-size:20px; 
  }
  .tool-btn:hover{ background:#f0f0f0; border-color:var(--border); }
  .tool-btn.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:36px; height:36px;
    border-radius:6px; border:1px solid var(--border);
    background:#fff; cursor:pointer; color:var(--text);
    font-size:20px; 
  }
  .icon-btn:hover{ background:#f0f0f0; }
  .icon-btn:disabled{ opacity:.35; cursor:default; }
  .icon-btn:disabled:hover{ background:#fff; }


  .size-row{ display:flex; align-items:center; gap:8px; }
  #sizeInput{
    width:52px; padding:6px 4px; text-align:center;
    border:1px solid var(--border); border-radius:6px;
    font-size:13px; font-variant-numeric:tabular-nums;
  }
  .size-preview{
    width:36px; height:36px; border:1px solid var(--border); border-radius:6px;
    display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .size-dot{ border-radius:50%; background:#000; }


  .swatch-current{ display:flex; gap:4px; }
  .swatch-box{
    width:22px; height:22px; border:1px solid #00000030; border-radius:4px;
    cursor:pointer;
  }
  #primarySwatch{ z-index:2; }
  #secondarySwatch{ margin-left:-10px; margin-top:6px; }
  .palette{
    display:grid;
    grid-template-columns: repeat(10, 16px);
    grid-auto-rows:16px;
    gap:3px;
  }
  .palette button{
    width:16px; height:16px; border-radius:3px;
    border:1px solid #00000020; cursor:pointer; padding:0;
  }
  .palette button.selected{ outline:2px solid var(--accent); outline-offset:1px; }
  #customColorInput{
    width:36px; height:36px; padding:0; border:1px solid var(--border);
    border-radius:6px; cursor:pointer; background:#fff;
  }

  
  .canvas-wrap{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    overflow:auto;
    padding:24px;
  }
  #paintCanvas{
    background:#fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.15), 0 0 0 1px var(--border);
    cursor:crosshair;
  }

  .statusbar{
    display:flex; justify-content:space-between;
    padding:5px 14px;
    background:var(--ribbon-bg);
    border-top:1px solid var(--border);
    font-size:11.5px; color:var(--text-dim);
  }
</style>
</head>
<body>
<div class="app">

  <div class="titlebar">
    🎨 Paint
  </div>

  <div class="ribbon">

    <!-- Tools -->
    <div class="group">
      <div class="group-body">
        <button class="tool-btn active" data-tool="pencil" title="Pencil (P)">
          🖍
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
         🪨
        </button>
        <button class="tool-btn" data-tool="rect" title="Rectangle (R)">
          ▯
        </button>
        <button class="tool-btn" data-tool="square" title="Square (S)">
          ☐
        </button>
        <button class="tool-btn" data-tool="circle" title="Circle (C)">
          〇
        </button>
        <button class="tool-btn" data-tool="oval" title="Oval (O)">
         ⬭
        </button>
        <button class="tool-btn" data-tool="fillrect" title="Filled rectangle">
          █
        </button>
        <button class="tool-btn" data-tool="fillsquare" title="Filled square">
          ◼
        </button>
        <button class="tool-btn" data-tool="fillcircle" title="Filled circle">
          ⬤
        </button>
        <button class="tool-btn" data-tool="filloval" title="Filled oval">
          ⬬
        </button>
      </div>
      <div class="group-label">🛠Tools</div>
    </div>

    <!-- Brush size -->
    <div class="group">
      <div class="group-body">
        <div class="size-preview"><div class="size-dot" id="sizeDot"></div></div>
        <div class="size-row">
          <input type="number" id="sizeInput" min="1" max="100" value="4">
        </div>
      </div>
      <div class="group-label">🖌️Brush size</div>
    </div>

    <!-- Colors -->
    <div class="group">
      <div class="group-body">
        <div class="swatch-current">
          <div class="swatch-box" id="primarySwatch" title="Primary color" style="background:#000000"></div>
          <div class="swatch-box" id="secondarySwatch" title="Eraser / background color" style="background:#ffffff"></div>
        </div>
        <div class="palette" id="palette"></div>
        <input type="color" id="customColorInput" value="#000000" title="Custom color">
      </div>
      <div class="group-label">🎨Colors Palette</div>
    </div>

    <!-- Actions -->
    <div class="group">
      <div class="group-body">
        <button class="icon-btn" id="clearBtn" title="Clear canvas" >
          🗑
        </button>
      </div>
      <div class="group-label">🗑️Clear Canvas</div>
    </div>

  </div>

  <div class="canvas-wrap">
    <canvas id="paintCanvas" width="760" height="480"></canvas>
  </div>

  <div class="statusbar">
    <span id="statusTool">Pencil</span>
    <span id="statusPos">x: -, y: -</span>
  </div>

</div>

<script>
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
let imageData = ctx.createImageData(canvas.width, canvas.height);
let data = imageData.data;

function putPixel(x, y, r, g, b, a = 255) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return;
  const idx = (y * canvas.width + x) * 4;
  data[idx] = r;
  data[idx + 1] = g;
  data[idx + 2] = b;
  data[idx + 3] = a;
}

// Digital Differential Analyzer line, same approach as the lesson.
function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
  x1 = Math.round(x1); y1 = Math.round(y1); x2 = Math.round(x2); y2 = Math.round(y2);
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);
  if (dx === 0 && dy === 0) { putPixel(x1, y1, r, g, b, a); return; }
  if (dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    const xStart = Math.min(x1, x2), xEnd = Math.max(x1, x2);
    for (let x = xStart; x <= xEnd; x++) putPixel(x, Math.round(m * x + c), r, g, b, a);
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    const yStart = Math.min(y1, y2), yEnd = Math.max(y1, y2);
    for (let y = yStart; y <= yEnd; y++) putPixel(Math.round(m * y + c), y, r, g, b, a);
  }
}

function drawRectFilled(x1, y1, x2, y2, r, g, b, a = 255) {
  const xs = Math.min(x1, x2), xe = Math.max(x1, x2);
  const ys = Math.min(y1, y2), ye = Math.max(y1, y2);
  for (let y = ys; y <= ye; y++) {
    for (let x = xs; x <= xe; x++) putPixel(x, y, r, g, b, a);
  }
}

// Thick outline rectangle: nested inset borders, `size` pixels thick.
function drawRectOutline(x1, y1, x2, y2, size, r, g, b, a = 255) {
  const xs = Math.min(x1, x2), xe = Math.max(x1, x2);
  const ys = Math.min(y1, y2), ye = Math.max(y1, y2);
  const t = Math.max(1, Math.round(size));
  for (let i = 0; i < t; i++) {
    if (xs + i > xe - i || ys + i > ye - i) break;
    drawLine(xs + i, ys + i, xe - i, ys + i, r, g, b, a);
    drawLine(xs + i, ye - i, xe - i, ye - i, r, g, b, a);
    drawLine(xs + i, ys + i, xs + i, ye - i, r, g, b, a);
    drawLine(xe - i, ys + i, xe - i, ye - i, r, g, b, a);
  }
}

// Filled ellipse, same implicit-equation test as the lesson.
function drawEllipseFilled(cx, cy, rx, ry, r, g, b, a = 255) {
  rx = Math.max(1, Math.round(rx));
  ry = Math.max(1, Math.round(ry));
  for (let y = -ry; y <= ry; y++) {
    for (let x = -rx; x <= rx; x++) {
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) putPixel(cx + x, cy + y, r, g, b, a);
    }
  }
}

// Midpoint-ellipse outline (1px ring), reused with an offset loop for thickness.
function drawEllipseOutline1px(cx, cy, rx, ry, r, g, b, a = 255) {
  rx = Math.max(1, Math.round(rx));
  ry = Math.max(1, Math.round(ry));
  const plot4 = (x, y) => {
    putPixel(cx + x, cy + y, r, g, b, a);
    putPixel(cx - x, cy + y, r, g, b, a);
    putPixel(cx + x, cy - y, r, g, b, a);
    putPixel(cx - x, cy - y, r, g, b, a);
  };
  let x = 0, y = ry;
  const rx2 = rx * rx, ry2 = ry * ry;
  const twoRx2 = 2 * rx2, twoRy2 = 2 * ry2;
  let px = 0, py = twoRx2 * y;
  plot4(x, y);
  let p = ry2 - rx2 * ry + 0.25 * rx2;
  while (px < py) {
    x++; px += twoRy2;
    if (p < 0) { p += ry2 + px; }
    else { y--; py -= twoRx2; p += ry2 + px - py; }
    plot4(x, y);
  }
  p = ry2 * (x + 0.5) * (x + 0.5) + rx2 * (y - 1) * (y - 1) - rx2 * ry2;
  while (y > 0) {
    y--; py -= twoRx2;
    if (p > 0) { p += rx2 - py; }
    else { x++; px += twoRy2; p += rx2 - py + px; }
    plot4(x, y);
  }
}

function drawEllipseOutline(cx, cy, rx, ry, size, r, g, b, a = 255) {
  const t = Math.max(1, Math.round(size));
  for (let i = 0; i < t; i++) {
    const rrx = rx - i, rry = ry - i;
    if (rrx < 1 || rry < 1) break;
    drawEllipseOutline1px(cx, cy, rrx, rry, r, g, b, a);
  }
}

// Brush stamp + interpolated stroke, so pencil/eraser get a real adjustable width.
function stampBrush(x, y, size, r, g, b, a = 255) {
  const radius = Math.max(0, Math.round(size / 2));
  if (radius <= 0) putPixel(x, y, r, g, b, a);
  else drawEllipseFilled(x, y, radius, radius, r, g, b, a);
}
function strokeBrush(x1, y1, x2, y2, size, r, g, b, a = 255) {
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.max(1, Math.ceil(dist));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    stampBrush(Math.round(x1 + (x2 - x1) * t), Math.round(y1 + (y2 - y1) * t), size, r, g, b, a);
  }
}

function render() { ctx.putImageData(imageData, 0, 0); }
function clearCanvas() { drawRectFilled(0, 0, canvas.width - 1, canvas.height - 1, 255, 255, 255); }
clearCanvas();
render();

/* ======================================================================
   APP STATE
   ====================================================================== */
let currentTool = 'pencil';
let brushSize = 4;
let primaryColor = { r: 0, g: 0, b: 0 };
const bgColor = { r: 255, g: 255, b: 255 };

let isDragging = false;
let startX = 0, startY = 0, lastX = 0, lastY = 0;
let dragSnapshot = null;

function hexToRgb(hex) {
  const v = hex.replace('#', '');
  return {
    r: parseInt(v.substring(0, 2), 16),
    g: parseInt(v.substring(2, 4), 16),
    b: parseInt(v.substring(4, 6), 16)
  };
}
function rgbToHex({ r, g, b }) {
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

/* ======================================================================
   UI WIRING
   ====================================================================== */
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTool = btn.dataset.tool;
    const label = {
      pencil: 'Pencil', eraser: 'Eraser',
      rect: 'Rectangle', square: 'Square', circle: 'Circle', oval: 'Oval',
      fillrect: 'Filled rectangle', fillsquare: 'Filled square', fillcircle: 'Filled circle', filloval: 'Filled oval'
    }[currentTool];
    document.getElementById('statusTool').textContent = label;
  });
});

const sizeInput = document.getElementById('sizeInput');
const sizeDot = document.getElementById('sizeDot');
function updateSizeDot() {
  const d = Math.max(2, Math.min(28, brushSize));
  sizeDot.style.width = d + 'px';
  sizeDot.style.height = d + 'px';
  sizeDot.style.background = rgbToHex(primaryColor);
}
sizeInput.addEventListener('input', () => {
  let v = parseInt(sizeInput.value, 10);
  if (isNaN(v)) v = 1;
  v = Math.max(1, Math.min(100, v));
  brushSize = v;
  updateSizeDot();
});
updateSizeDot();

// Classic 20-color palette
const PALETTE = [
  '#000000', '#7F7F7F', '#880015', '#ED1C24', '#FF7F27', '#FFF200', '#22B14C', '#00A2E8', '#3F48CC', '#A349A4',
  '#FFFFFF', '#C3C3C3', '#B97A57', '#FFAEC9', '#FFC90E', '#EFE4B0', '#B5E61D', '#99D9EA', '#7092BE', '#C8BFE7'
];
const paletteEl = document.getElementById('palette');
PALETTE.forEach(hex => {
  const b = document.createElement('button');
  b.style.background = hex;
  b.title = hex;
  b.addEventListener('click', (e) => {
    setPrimaryColor(hexToRgb(hex));
    paletteEl.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
  });
  paletteEl.appendChild(b);
});

const primarySwatch = document.getElementById('primarySwatch');
const customColorInput = document.getElementById('customColorInput');
function setPrimaryColor(rgb) {
  primaryColor = rgb;
  const hex = rgbToHex(rgb);
  primarySwatch.style.background = hex;
  customColorInput.value = hex;
  updateSizeDot();
}
customColorInput.addEventListener('input', () => {
  setPrimaryColor(hexToRgb(customColorInput.value));
  paletteEl.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
});
primarySwatch.addEventListener('click', () => customColorInput.click());

document.getElementById('clearBtn').addEventListener('click', () => {
  clearCanvas();
  render();
});

/* ======================================================================
   CANVAS INTERACTION
   ====================================================================== */
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.round((e.clientX - rect.left) * scaleX),
    y: Math.round((e.clientY - rect.top) * scaleY)
  };
}

function drawPreviewShape(x1, y1, x2, y2) {
  const c = primaryColor;
  if (currentTool === 'rect') {
    drawRectOutline(x1, y1, x2, y2, brushSize, c.r, c.g, c.b);
  } else if (currentTool === 'fillrect') {
    drawRectFilled(x1, y1, x2, y2, c.r, c.g, c.b);
  } else if (currentTool === 'square' || currentTool === 'fillsquare') {
    const side = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
    const sx2 = x1 + side * (x2 >= x1 ? 1 : -1);
    const sy2 = y1 + side * (y2 >= y1 ? 1 : -1);
    if (currentTool === 'fillsquare') drawRectFilled(x1, y1, sx2, sy2, c.r, c.g, c.b);
    else drawRectOutline(x1, y1, sx2, sy2, brushSize, c.r, c.g, c.b);
  } else if (currentTool === 'circle') {
    const radius = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
    drawEllipseOutline(x1, y1, radius, radius, brushSize, c.r, c.g, c.b);
  } else if (currentTool === 'fillcircle') {
    const radius = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
    drawEllipseFilled(x1, y1, radius, radius, c.r, c.g, c.b);
  } else if (currentTool === 'oval') {
    drawEllipseOutline(x1, y1, Math.abs(x2 - x1), Math.abs(y2 - y1), brushSize, c.r, c.g, c.b);
  } else if (currentTool === 'filloval') {
    drawEllipseFilled(x1, y1, Math.abs(x2 - x1), Math.abs(y2 - y1), c.r, c.g, c.b);
  }
}

const SHAPE_TOOLS = ['rect', 'square', 'circle', 'oval', 'fillrect', 'fillsquare', 'fillcircle', 'filloval'];
const isShapeTool = () => SHAPE_TOOLS.includes(currentTool);

canvas.addEventListener('mousedown', (e) => {
  const { x, y } = getPos(e);
  isDragging = true;
  startX = x; startY = y; lastX = x; lastY = y;

  if (isShapeTool()) {
    dragSnapshot = new Uint8ClampedArray(data);
  } else {
    const c = currentTool === 'eraser' ? bgColor : primaryColor;
    strokeBrush(x, y, x, y, brushSize, c.r, c.g, c.b);
    render();
  }
});

window.addEventListener('mousemove', (e) => {
  const { x, y } = getPos(e);
  document.getElementById('statusPos').textContent = `x: ${Math.max(0, Math.min(canvas.width, x))}, y: ${Math.max(0, Math.min(canvas.height, y))}`;

  if (!isDragging) return;

  if (isShapeTool()) {
    data.set(dragSnapshot);
    drawPreviewShape(startX, startY, x, y);
    render();
  } else {
    const c = currentTool === 'eraser' ? bgColor : primaryColor;
    strokeBrush(lastX, lastY, x, y, brushSize, c.r, c.g, c.b);
    render();
    lastX = x; lastY = y;
  }
});

window.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  dragSnapshot = null;
});

// Touch support (mirrors the mouse handlers)
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY }));
}, { passive: false });
window.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const t = e.touches[0];
  window.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
}, { passive: false });
window.addEventListener('touchend', () => {
  window.dispatchEvent(new MouseEvent('mouseup'));
});

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  const map = { p: 'pencil', e: 'eraser', r: 'rect', s: 'square', c: 'circle', o: 'oval' };
  const tool = map[e.key.toLowerCase()];
  if (tool) document.querySelector(`.tool-btn[data-tool="${tool}"]`).click();
});
</script>
</body>
</html>
